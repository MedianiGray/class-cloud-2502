<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>页面不存在 · 班级云库</title>
<style>
:root{--paper:#F2F1EC;--ink:#17211D;--ink2:#4C594F;--ink3:#87918A;--line:#CDD2C9;--green:#2E5348}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:grid;place-items:center;padding:28px;background:var(--paper);color:var(--ink);
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;line-height:1.7;
  background-image:radial-gradient(var(--line) 1px,transparent 1px);background-size:22px 22px}
.box{width:100%;max-width:480px;background:#FBFAF5;border:1px solid #B9C0B5;padding:30px 26px 26px}
.k{font-family:ui-monospace,Consolas,monospace;font-size:11px;letter-spacing:.12em;color:var(--ink3);margin-bottom:16px}
h1{font-size:26px;font-weight:700;letter-spacing:-.02em;line-height:1.3;margin-bottom:10px}
p{font-size:14px;color:var(--ink2);margin-bottom:22px}
a{display:inline-flex;align-items:center;justify-content:center;height:46px;padding:0 20px;background:var(--green);color:#fff;
  text-decoration:none;font-size:14.5px;font-weight:600}
a:hover{background:#263F36}
hr{border:0;border-top:1px solid var(--line);margin:20px 0 14px}
.tip{font-size:12.5px;color:var(--ink3);margin:0}
</style>
</head>
<body>
  <main class="box">
    <div class="k">404 / NOT FOUND</div>
    <h1>这个地址没有内容</h1>
    <p>班级云库只有五个页面：概览、班级云库、学校入口、权限、维护。可能是链接后缀抄错，或者仓库改过名——仓库一旦改名，Pages 的访问地址会跟着变。</p>
    <a href="./">回到概览</a>
    <hr>
    <p class="tip">如果连首页也打不开，检查一下仓库 Settings → Pages 是否处于已发布状态。</p>
  </main>
</body>
</html>
